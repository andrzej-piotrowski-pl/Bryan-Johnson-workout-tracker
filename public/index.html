<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="Unofficial home workout planner and tracker based on Bryan Johnson's public exercise protocol.">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/vendor/fonts/@fontsource-variable/inter/index.css">
<!-- Extra weights for the themes; a font file only downloads when a theme uses it. -->
<link rel="stylesheet" href="/vendor/fonts/@fontsource/barlow-condensed/300.css">
<link rel="stylesheet" href="/vendor/fonts/@fontsource/barlow-condensed/500.css">
<link rel="stylesheet" href="/vendor/fonts/@fontsource/barlow-condensed/600.css">

<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/themes.css">
<script>
  // Apply the saved theme and light/dark mode before first paint (no flash).
  // Mirrors applyLook() in js/themes.js.
  try {
    var root = document.documentElement;
    var skin = JSON.parse(localStorage.getItem("hp:skin") || '"original"');
    var t = JSON.parse(localStorage.getItem("hp:theme") || '"system"');
    root.dataset.skin = skin;
    if (skin === "darkroom") t = "dark";
    if (t === "light" || t === "dark") root.dataset.theme = t;
    root.dataset.scheme = t === "light" || t === "dark" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  } catch (e) {}
</script>
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
</head>
<body>

      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text"><b>Home Protocol</b><small>Bryan Johnson–inspired</small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="save-status" id="save-status" role="status" aria-live="polite"></div>
    </div>
  </aside>
  <header class="topbar">
    <a class="brand small" href="#/today"><span class="brand-mark" aria-hidden="true"></span><b>Home Protocol</b></a>
    <div class="save-status" id="save-status-top" role="status" aria-live="polite"></div>
  </header>
  <main class="main" id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
</div>
<div id="overlay-root"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px">This app needs JavaScript.</p></noscript>
<script type="module" src="/js/main.js"></script>
</body>
</html>
